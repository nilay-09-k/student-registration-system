<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0
">    <title>Document</title>
</head>
<body>
    <h1>Student Registration Portal</h1>
    <h3> Welcome to XYZ Institute. Please fill out the registration form below.</h3>
    <hr>
    <h2>Student Profile</h2>
    <img src="./flat-business-man-user-profile-avatar-icon-vector-4333097.avif"  alt="" style="width:100px">
    <h3>Student Registration form </h3>
    <forms>
        <label name="name">Name:</label>
        <input type="text" name="name" placeholder="Enter your name" required>
        <br><br>
        <label name="email">Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required>
        <br><br>
        <label name="password">Password:</label>
        <input type="password" name="password" placeholder="Enter your password" required>
        <br><br>
        <label name="phone">Phone:</label>
        <input type="tel" name="phone" placeholder="Enter your phone number" required>
        <br><br>
        <label name="dob">Date of Birth:</label>
        <input type="date" name="dob" required>
        <br><br>
        <label name="gender">Gender:</label>
        <input type="radio" name="gender" value="male" required> Male
        <input type="radio" name="gender" value="female" required> Female
        <input type="radio" name="gender" value="other" required> Other
        <br><br>
        <label skills="skills">Skills:</label>
        <input type="checkbox" name="skills" value="html"> HTML
        <input type="checkbox" name="skills" value="css"> CSS
        <input type="checkbox" name="skills" value="javascript"> JavaScript
        <input type="checkbox" name="skills" value="React"> React
    </forms>
